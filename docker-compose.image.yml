services:
  db:
    image: postgres:16-alpine
    container_name: rolemapper-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rolemapper}
      POSTGRES_USER: ${POSTGRES_USER:-rolemapper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rolemapper}
    volumes:
      - rolemapper-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rolemapper} -d ${POSTGRES_DB:-rolemapper}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rolemapper:
    image: ${ROLEMAPPER_IMAGE:-ghcr.io/syschelle/rolemapper:latest}
    container_name: rolemapper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ROLEMAPPER_PORT:-5080}:5080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rolemapper}:${POSTGRES_PASSWORD:-rolemapper}@db:5432/${POSTGRES_DB:-rolemapper}
    volumes:
      - ./config:/app/config
      - ./output:/app/output
      - ./Aufgabe:/app/Aufgabe
      - ./mapping_store:/app/mapping_store
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5080/healthz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  rolemapper-db-data:
