name: Publish GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release notes from annotated tag
        run: |
          git fetch --force --tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag" ]; then
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md
          else
            git log -1 --format='%B' "${GITHUB_REF_NAME}" > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            printf 'Release %s\n' "${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Rolemapper ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Rolemapper ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
