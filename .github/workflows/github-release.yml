name: Publish GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release notes from annotated tag
        run: |
          git fetch --force --tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag" ]; then
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md
          else
            git log -1 --format='%B' "${GITHUB_REF_NAME}" > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            printf 'Release %s\n' "${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > release-payload.json
          import json
          import os

          payload = {
              "tag_name": os.environ["GITHUB_REF_NAME"],
              "target_commitish": os.environ["GITHUB_SHA"],
              "name": f"Rolemapper {os.environ['GITHUB_REF_NAME']}",
              "body": open("release-notes.md", encoding="utf-8").read(),
              "draft": False,
              "prerelease": False,
          }
          print(json.dumps(payload))
          PY

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          get_code=$(curl -sS -o release-response.json -w '%{http_code}' "${headers[@]}" "${api}/tags/${GITHUB_REF_NAME}")
          if [ "${get_code}" = "200" ]; then
            release_id=$(python -c 'import json; print(json.load(open("release-response.json"))["id"])')
            curl -sS -f -X PATCH "${headers[@]}" "${api}/${release_id}" --data @release-payload.json
          else
            curl -sS -f -X POST "${headers[@]}" "${api}" --data @release-payload.json
          fi
